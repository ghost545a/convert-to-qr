<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convert to QR</title>
<meta name="description" content="Turn any website link into a QR code and download it as a PNG. Runs entirely in your browser.">
<meta name="author" content="Mohammed Anwar Mahram">
<meta property="og:title" content="Convert to QR">
<meta property="og:description" content="Turn any website link into a QR code PNG, right in your browser.">
<meta property="og:image" content="https://ghost545a.github.io/convert-to-qr/example.png">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f5f5f7; --surface: #ffffff; --field: #f5f5f7; --text: #1d1d1f; --text-2: #6e6e73;
    --line: rgba(0, 0, 0, .12); --accent: #0071e3; --accent-hover: #0077ed; --error: #d70015;
    --shadow: 0 1px 3px rgba(0, 0, 0, .05), 0 20px 50px rgba(0, 0, 0, .1);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, Arial, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --surface: #161617; --field: #000000; --text: #f5f5f7; --text-2: #a1a1a6;
      --line: rgba(255, 255, 255, .16); --accent: #0071e3; --error: #ff453a;
      --shadow: 0 1px 3px rgba(0, 0, 0, .4), 0 20px 50px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: clamp(24px, 6vw, 64px) 16px 32px; background: var(--bg); color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  header { text-align: center; margin-bottom: 28px; max-width: 34rem; }
  h1 { margin: 0; font-size: clamp(2.2rem, 7vw, 3.2rem); letter-spacing: -0.035em; line-height: 1.05; }
  header p { margin: 12px 0 0; color: var(--text-2); font-size: 1.1rem; line-height: 1.45; }
  .card {
    width: min(100%, 440px); padding: 24px; border-radius: 28px; background: var(--surface); box-shadow: var(--shadow);
  }
  label { display: block; font-size: .85rem; font-weight: 600; color: var(--text-2); margin: 0 0 6px; }
  input[type="text"], input[type="url"] {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    font: 1rem var(--font); color: var(--text); background: var(--field);
  }
  input:focus-visible, .btn:focus-visible { outline: 3px solid rgba(0, 113, 227, .5); outline-offset: 2px; }
  .field + .field { margin-top: 14px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: .95rem; color: var(--text); font-weight: 400; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .preview { margin-top: 20px; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px var(--line); }
  canvas { display: block; width: 100%; height: auto; }
  .error { margin: 12px 0 0; color: var(--error); font-size: .9rem; min-height: 1.2em; }
  .actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .btn {
    flex: 1 1 auto; border: 0; border-radius: 999px; padding: 12px 20px; font: 500 1rem var(--font); cursor: pointer;
    background: var(--accent); color: #fff; text-align: center; text-decoration: none;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.plain { background: rgba(127, 127, 127, .14); color: var(--text); }
  footer { margin-top: 28px; text-align: center; font-size: .85rem; color: var(--text-2); line-height: 1.6; }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <header>
    <h1>Convert to QR</h1>
    <p>Paste a website link and get a QR code you can download as a PNG. Everything happens in your browser.</p>
  </header>

  <main class="card">
    <div class="field">
      <label for="url">Website link</label>
      <input id="url" type="url" inputmode="url" autocomplete="url" spellcheck="false"
             placeholder="https://example.com" value="https://ghost545a.github.io/">
    </div>
    <div class="field">
      <label for="note">Extra line under the code (optional)</label>
      <input id="note" type="text" maxlength="40" placeholder="e.g. your name or “Scan for the menu”">
    </div>
    <label class="check"><input id="showLink" type="checkbox" checked> Show the link under the code</label>

    <div class="preview"><canvas id="qr" width="1200" height="1200" aria-label="QR code preview"></canvas></div>
    <p class="error" id="error" role="status" aria-live="polite"></p>

    <div class="actions">
      <button class="btn" id="download" type="button">Download PNG</button>
      <a class="btn plain" id="open" href="https://ghost545a.github.io/" target="_blank" rel="noopener">Test the link</a>
    </div>
  </main>

  <footer>
    Made by <a href="https://ghost545a.github.io/">Mohammed Anwar Mahram</a> · <a href="https://github.com/ghost545a/convert-to-qr">Source on GitHub</a><br>
    QR encoding by <a href="https://github.com/kazuhikoarase/qrcode-generator">qrcode-generator</a> (MIT)
  </footer>

  <script src="vendor/qrcode.min.js"></script>
  <script>
    // Convert to QR: draws a scannable QR code (plus optional caption) on a
    // 1200px-wide canvas, so the downloaded PNG prints sharply.
    const SIZE = 1200;                      // width of the PNG, in pixels
    const QUIET = 4;                        // standard white border, in modules
    const canvas = document.getElementById('qr');
    const ctx = canvas.getContext('2d');
    const urlIn = document.getElementById('url');
    const noteIn = document.getElementById('note');
    const showLink = document.getElementById('showLink');
    const errorEl = document.getElementById('error');
    const downloadBtn = document.getElementById('download');
    const openLink = document.getElementById('open');
    const FONT = '-apple-system, "Segoe UI", system-ui, Arial, sans-serif';
    // Encode text as UTF-8 (the library defaults to Latin-1, which breaks Arabic, Turkish, emoji...)
    qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

    // "example.com" -> "https://example.com"; keeps http(s), mailto:, tel: etc. as typed
    function normalise(raw) {
      const t = raw.trim();
      if (!t) return '';
      return /^[a-z][a-z0-9+.-]*:/i.test(t) ? t : 'https://' + t;
    }
    // Web links are percent-encoded the way browsers send them, so every scanner opens them
    function toQrData(link) {
      if (!/^https?:/i.test(link)) return link;
      try { return new URL(link).href; } catch (e) { return link; }
    }
    function shortLabel(link) {
      let t = link;
      try { t = decodeURI(t); } catch (e) {}
      return t.replace(/^https?:\/\//i, '').replace(/\/$/, '');
    }

    function draw(link, note) {
      const qr = qrcode(0, 'M');            // smallest version that fits, ~15% error correction
      qr.addData(toQrData(link));
      qr.make();
      const n = qr.getModuleCount();
      const cell = Math.floor(SIZE / (n + QUIET * 2));
      const offset = Math.floor((SIZE - cell * n) / 2);

      const lines = [];
      if (showLink.checked) lines.push({ text: shortLabel(link), font: `600 56px ${FONT}`, color: '#1d1d1f' });
      if (note) lines.push({ text: note, font: `400 44px ${FONT}`, color: '#6e6e73' });
      canvas.width = SIZE;
      canvas.height = SIZE + (lines.length ? 40 + lines.length * 66 : 0);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#1d1d1f';
      for (let r = 0; r < n; r++)
        for (let c = 0; c < n; c++)
          if (qr.isDark(r, c)) ctx.fillRect(offset + c * cell, offset + r * cell, cell, cell);

      ctx.textAlign = 'center';
      lines.forEach((l, i) => {
        ctx.font = l.font; ctx.fillStyle = l.color;
        // shrink long captions so they fit the width
        let size = parseInt(l.font.match(/(\d+)px/)[1], 10);
        while (ctx.measureText(l.text).width > SIZE - 120 && size > 24) {
          size -= 2; ctx.font = l.font.replace(/\d+px/, size + 'px');
        }
        ctx.fillText(l.text, SIZE / 2, SIZE + 40 + i * 66);
      });
    }

    function update() {
      const link = normalise(urlIn.value);
      const note = noteIn.value.trim();
      errorEl.textContent = '';
      if (!link) {
        errorEl.textContent = 'Type or paste a link to make a QR code.';
        downloadBtn.disabled = true; return;
      }
      try {
        draw(link, note);
        downloadBtn.disabled = false;
        openLink.href = link;
      } catch (e) {
        errorEl.textContent = 'That link is too long to fit in a QR code.';
        downloadBtn.disabled = true;
      }
    }

    function fileName() {
      const base = shortLabel(normalise(urlIn.value)).replace(/[^a-z0-9.-]+/gi, '-').replace(/^-+|-+$/g, '').slice(0, 60);
      return 'qr-' + (base || 'code') + '.png';
    }

    downloadBtn.addEventListener('click', () => {
      canvas.toBlob((blob) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileName();
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }, 'image/png');
    });
    [urlIn, noteIn].forEach((el) => el.addEventListener('input', update));
    showLink.addEventListener('change', update);

    // Share a ready-made code: ?url=https://example.com&note=Hello
    const params = new URLSearchParams(location.search);
    if (params.get('url')) urlIn.value = params.get('url');
    if (params.get('note')) noteIn.value = params.get('note');
    update();

    // #export prints the PNG as text (used to make example.png with headless Chrome)
    if (location.hash === '#export') {
      const out = document.createElement('pre');
      out.id = 'png'; out.hidden = true; out.textContent = canvas.toDataURL('image/png');
      document.body.appendChild(out);
    }
  </script>
</body>
</html>
